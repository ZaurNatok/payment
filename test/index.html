const billKopecks = 235600;
function formatMoney(kopecks) {
  return new Intl.NumberFormat(document.documentElement.lang, {
    style:'currency', currency:'RUB', minimumFractionDigits:kopecks % 100 ? 2 : 0, maximumFractionDigits:2
  }).format(kopecks/100);
}
function updateReceipt() {
  const tip = Math.round(billKopecks * Number([...tipOptions].find(option => option.checked)?.value || 0)/100);
  const total = formatMoney(billKopecks + tip);
  byId('billValue').textContent = formatMoney(billKopecks);
  byId('tipValue').textContent = formatMoney(tip);
  byId('totalValue').textContent = byId('coverAmount').textContent = total;
  byId('payLabel').textContent = strings.pay + ' ' + total;
}
function updateStars() {
  const score = Number([...starOptions].find(option => option.checked)?.value || 0);
  for (const star of starOptions) {
    star.setAttribute('aria-label', strings.score + ' ' + star.value + '/5');
    star.nextElementSibling.classList.toggle('lit', Number(star.value) <= score);
  }
}

function initialLanguage(preferences) {
  const supported = { en: 'en', ru: 'ru', zh: 'zh-CN' };
  for (const tag of preferences) {
    if (typeof tag !== 'string') continue;
    const base = tag.trim().toLowerCase().split(/[-_]/)[0];
    if (Object.prototype.hasOwnProperty.call(supported, base)) return supported[base];
  }
  return 'en';
}

function cardNetwork(raw) {
  if (raw.length < 6) return '';
  const prefix = Number(raw.slice(0,4));
  if (prefix >= 2200 && prefix <= 2204) return 'mir';
  if (prefix === 9112) return 'bel';
  if (/^5[1-5]/.test(raw) || (prefix >= 2221 && prefix <= 2720)) return 'mc';
  if (/^4/.test(raw)) return 'visa';
  if (/^(62|81)/.test(raw) && !raw.startsWith('627780')) return 'cup';
  return '';
}
function updateNetwork() {
  const network = cardNetwork(byId('number').value.replace(/ /g,''));
  const badge = byId('network');
  if (badge.dataset.network === network) return;
  badge.dataset.network = network;
  badge.replaceChildren();
  if (network) badge.append(document.querySelector('footer .'+network).cloneNode(true));
}
function maskDigits(id,limit,format) {
  const field = byId(id);
  const digits = value => value.replace(/[^0-9]/g,'');
  function display(raw, index) {
    field.value = format(raw.slice(0,limit));
    let caret = 0;
    let count = 0;
    while (caret < field.value.length && count < index) {
      if (/[0-9]/.test(field.value[caret])) count++;
      caret++;
    }
    field.setSelectionRange(caret,caret);
    refresh();
  }
  function insert(text) {
    const left = digits(field.value.slice(0,field.selectionStart));
    const right = digits(field.value.slice(field.selectionEnd));
    const added = digits(text).slice(0,Math.max(0,limit-left.length-right.length));
    if (added) display(left+added+right,left.length+added.length);
  }
  field.addEventListener('beforeinput', event => {
    if (!event.cancelable) return;
    if (event.inputType.startsWith('insert') && typeof event.data === 'string') {
      event.preventDefault();
      insert(event.data);
    } else if (field.selectionStart === field.selectionEnd) {
      const pos = field.selectionStart;
      if (event.inputType === 'deleteContentBackward' && /[ /]/.test(field.value.charAt(pos-1))) field.setSelectionRange(pos-2,pos);
      if (event.inputType === 'deleteContentForward' && /[ /]/.test(field.value.charAt(pos))) field.setSelectionRange(pos,pos+2);
    }
  });
  field.addEventListener('paste', event => {
    if (!event.clipboardData) return;
    event.preventDefault();
    insert(event.clipboardData.getData('text/plain'));
  });
  field.addEventListener('input', () => display(digits(field.value),digits(field.value.slice(0,field.selectionStart)).length));
}

function loadOcr() {
  if (!ocrLibrary) {
    ocrLibrary = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';
      script.onload = () => resolve(window.Tesseract);
      script.onerror = () => { script.remove(); reject(new Error('OCR unavailable')); };
      document.head.append(script);
    }).catch(error => { ocrLibrary = undefined; throw error; });
  }
  return ocrLibrary;
}
function findCardNumber(text) {
  const matches = new Set();
  for (const line of text.split(/\r?\n/)) {
    for (const match of line.matchAll(/[0-9](?:[ \t-]*[0-9])+/g)) {
      const number = match[0].replace(/[^0-9]/g, '');
      if (number.length >= 16 && number.length <= 18) matches.add(number);
    }
  }
  return matches.size === 1 ? [...matches][0] : '';
}

let method;
let timer;
function refresh() {
  updateNetwork();
  byId('pay').disabled = !form.checkValidity();
}
for (const button of document.querySelectorAll('[data-method]')) {
  button.addEventListener('click', () => {
    method = button.dataset.method;
    const sbp = method === 'СБП';
    const card = !sbp && method !== 'Apple Pay';
    inputs.forEach(input => input.value = '');
    inputs.forEach(input => input.disabled = !card);
    byId('fields').hidden = !card;
    byId('qrWrap').hidden = !sbp;
    if (sbp) {
      previousQR = (previousQR + 1 + Math.floor(Math.random() * (qrCodes.length - 1))) % qrCodes.length;
      byId('qr').src = qrCodes[previousQR];
    }
    byId('chosen').textContent = button.querySelector('[data-text]')?.textContent || method;
    byId('hint').textContent = card ? strings.cardHint : sbp ? strings.sbpHint : strings.appleHint;
    byId('entry').hidden = false;
    byId('result').hidden = byId('done').hidden = true;
    modal.setAttribute('aria-labelledby','chosen');
    refresh();
    modal.showModal();
    (card ? byId('number') : byId('pay')).focus();
  });
}
form.addEventListener('input', refresh);
form.addEventListener('submit', event => {
  event.preventDefault();
  if (!form.checkValidity() || byId('entry').hidden) return;
  const scheme = byId('network').dataset.network;
  if (!byId('fields').hidden && scheme) {
    const source = document.querySelector('.method .'+scheme).closest('button');
    byId('chosen').textContent = source.querySelector('[data-text]')?.textContent || source.dataset.method;
  }
  inputs.forEach(input => input.value = '');
  resetScanner();
  const paidTotal = byId('totalValue').textContent;
  byId('entry').hidden = true;
  byId('result').hidden = false;
  byId('symbol').className = 'spin';
  byId('symbol').textContent = '';
  byId('status').textContent = strings.working;
  byId('summary').textContent = byId('chosen').textContent + ' · ' + paidTotal;
  modal.setAttribute('aria-labelledby','status');
  byId('status').focus();
  timer = setTimeout(() => {
    byId('symbol').className = 'success';
    byId('symbol').textContent = '✓';
    byId('status').textContent = strings.success;
    byId('summary').textContent = byId('chosen').textContent + ' · ' + paidTotal + ' · ' + strings.summary;
    byId('done').hidden = false;
    byId('done').focus();
  }, 1250);
});
byId('cancel').onclick = () => modal.close();
byId('done').onclick = () => modal.close();

modal.addEventListener('close', () => { resetScanner(); clearTimeout(timer); if (!byId('result').hidden) { form.reset(); updateReceipt(); updateStars(); } inputs.forEach(input => input.value = ''); });
selectLanguage(initialLanguage([...(navigator.languages || []), navigator.language]));
if (cardPhoto) {
  byId('scanCard').onclick = () => cardPhoto.click();
  cardPhoto.onchange = async () => {
    const file = cardPhoto.files[0];
    if (!file) return;
    resetScanner();
    const version = scanVersion;
    byId('scanCard').disabled = true;
    scanStatus(strings.scanWorking);
    let worker;
    try {
      const engine = await loadOcr();
      if (version !== scanVersion) return;
      worker = await engine.createWorker('eng');
      if (version !== scanVersion) return;
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789 -',
        tessedit_pageseg_mode: engine.PSM.SPARSE_TEXT
      });
      const {data} = await worker.recognize(file);
      if (version !== scanVersion) return;
      const number = findCardNumber(data.text);
      if (!number) {
        scanStatus(strings.scanMiss);
        return;
      }
      byId('scanNumber').textContent = number.match(/.{1,4}/g).join(' ');
      byId('scanReview').hidden = false;
      scanStatus(strings.scanCheck);
    } catch {
      if (version === scanVersion) scanStatus(strings.scanError);
    } finally {
      if (version === scanVersion) byId('scanCard').disabled = false;
      if (worker) await worker.terminate().catch(() => {});
    }
  };
  byId('applyScan').onclick = () => {
    byId('number').value = byId('scanNumber').textContent;
    resetScanner();
    refresh();
    byId('expiry').focus();
  };
}
</script></body></html>
